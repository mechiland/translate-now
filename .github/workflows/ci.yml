name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Installs pnpm (from package.json) and Node.js (from .node-version), then runs a frozen install.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm compile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build:firefox
      - run: pnpm lint:firefox
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
