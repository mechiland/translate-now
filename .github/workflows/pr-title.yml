name: PR title

# Squash merges use the PR title as the commit message, and release-please builds the
# version bump and the release notes from it. Titles are written in English.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|revert|deps|docs|style|refactor|test|build|ci|chore)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat: translate a paragraph on hover' or 'fix(selection): keep the card on screen'. See docs/PUBLISHING.md."
            exit 1
          fi
