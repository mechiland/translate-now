name: Release

# Builds, tests and packages a tagged version, attaches the ZIPs to its GitHub Release
# and submits it to the Chrome Web Store and Firefox AMO.
#
# - Called by release-please.yml when a release PR is merged (the normal path).
# - Run manually to dry-run credentials or to retry one store for an existing tag.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Version tag created by release-please, e.g. v0.2.0'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag; leave empty only to dry-run the selected branch'
        required: false
        type: string
      store:
        description: 'Store to submit (retry one store independently)'
        type: choice
        options: [both, chrome, firefox]
        default: both
      dry_run:
        description: 'Check credentials without uploading or submitting'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      stores: ${{ steps.version.outputs.stores }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - name: Validate release tag and package version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          STORE: ${{ inputs.store || 'both' }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            if [ "$DRY_RUN" != "true" ]; then
              echo "::error::A version tag is required for actual publication."
              exit 1
            fi
            RELEASE_TAG="v$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          fi
          VERSION=$(node scripts/release.mjs check "$RELEASE_TAG")
          {
            echo "version=$VERSION"
            echo "tag=$RELEASE_TAG"
            echo "commit=$(git rev-parse HEAD)"
            if [ "$STORE" = "both" ]; then echo 'stores=["chrome","firefox"]'; else echo "stores=[\"$STORE\"]"; fi
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"
      - run: pnpm compile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm zip && pnpm zip:firefox
      - run: pnpm lint:firefox
      - uses: actions/upload-artifact@v7
        with:
          name: store-packages-${{ steps.version.outputs.version }}
          path: |
            .output/translate-now-${{ steps.version.outputs.version }}-chrome.zip
            .output/translate-now-${{ steps.version.outputs.version }}-firefox.zip
            .output/translate-now-${{ steps.version.outputs.version }}-sources.zip
          if-no-files-found: error
          retention-days: 30

  github-release:
    needs: build
    if: ${{ needs.build.outputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: store-packages-${{ needs.build.outputs.version }}
          path: .output
      - name: Attach packages to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          # release-please normally creates the release (with Chinese notes) before this runs.
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" .output/*.zip --clobber

  submit:
    name: Submit to ${{ matrix.store }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        store: ${{ fromJSON(needs.build.outputs.stores) }}
    # Never upload the same version to the same store twice at once (e.g. a manual retry).
    concurrency:
      group: submit-${{ needs.build.outputs.tag }}-${{ matrix.store }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - uses: actions/download-artifact@v8
        with:
          name: store-packages-${{ needs.build.outputs.version }}
          path: .output
      - name: Submit Chrome for review and automatic publication
        if: ${{ matrix.store == 'chrome' }}
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          DRY_RUN: ${{ needs.build.outputs.dry_run }}
        run: |
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          pnpm submit:chrome "${ARGS[@]}"
      - name: Submit Firefox and sources for public listing
        if: ${{ matrix.store == 'firefox' }}
        env:
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          DRY_RUN: ${{ needs.build.outputs.dry_run }}
        run: |
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          pnpm submit:firefox "${ARGS[@]}"
