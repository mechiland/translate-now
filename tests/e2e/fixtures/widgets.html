<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Widgets Fixture</title>
    <style>
      body {
        font: 16px/1.5 sans-serif;
        margin: 20px;
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 24px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }
      .row {
        display: flex;
        align-items: flex-start;
      }
      .grow {
        flex-grow: 1;
      }
      .headline {
        display: flex;
        align-items: center;
        width: 100%;
        border: 0;
        background: none;
        padding: 0;
        font: 600 20px/1.3 sans-serif;
        text-align: start;
        cursor: pointer;
      }
      dd[role='button'] {
        margin: 0;
        padding: 6px 0;
        cursor: pointer;
      }
      dt {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <aside id="sidebar">
      <div role="tooltip"><h2 id="chapter">Chapter 1: About this Course</h2></div>
      <dl aria-label="Course units list">
        <dt aria-hidden="true">Meet the Instructors</dt>
        <dd
          id="unit-1"
          role="button"
          tabindex="0"
          aria-label="Navigate to unit: Meet the Instructors"
        >
          <div class="list-item">
            <div role="tooltip"><span class="list-item-text">Meet the Instructors</span></div>
          </div>
        </dd>
      </dl>
    </aside>
    <main>
      <article id="story">
        <div class="row">
          <div class="grow">
            <button id="headline" class="headline" aria-label="Expand story" aria-expanded="false">
              <span>Airspace reopens after a communications failure halts all departures</span>
            </button>
          </div>
          <button aria-label="Mark as read">✓</button>
        </div>
        <div id="story-body"></div>
        <div>
          <button id="more" class="headline">
            See how airlines rebuilt their schedules after the ground stop
          </button>
        </div>
      </article>
      <form><input id="field" value="Typed value stays as is" /></form>
    </main>
    <script>
      document.getElementById('headline').addEventListener('click', (e) => {
        const btn = e.currentTarget;
        const body = document.getElementById('story-body');
        const open = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', String(!open));
        body.innerHTML = open
          ? ''
          : '<p id="summary">Flights resumed in the evening after a nationwide ground stop.' +
            '<button><span class="sr-only">Citation 1 from example.com</span>1</button></p>';
      });
    </script>
  </body>
</html>
